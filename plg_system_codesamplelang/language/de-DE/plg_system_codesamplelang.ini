PLG_SYSTEM_CODESAMPLELANG="System - CodeSampleLangM"
PLG_SYSTEM_CODESAMPLELANG_XML_DESCRIPTION="Legt die Sprachen im Code-Beispiel-Dialog von TinyMCE fest. Die Liste wird in den Plugin-Einstellungen gepflegt."

PLG_SYSTEM_CODESAMPLELANG_FIELD_NOTE_HELP_DESC="Diese Liste <strong>ersetzt</strong> die Sprachen im Code-Beispiel-Dropdown von TinyMCE: Es erscheinen nur die hier eingetragenen Sprachen, in dieser Reihenfolge. Für eine weitere Sprache eine Zeile hinzufügen, zum Ausblenden die Zeile entfernen.<br><strong>Anzeigename</strong> ist der Text im Dropdown, <strong>Prism-Wert</strong> die Kennung von <a href=\"https://prismjs.com/#supported-languages\" target=\"_blank\" rel=\"noopener\">prismjs.com</a>, z. B. sql, bash, kotlin, go, rust, powershell, docker."

PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_LABEL="Sprachen"
PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_DESC="Sprachen im Code-Beispiel-Dropdown, in dieser Reihenfolge."

