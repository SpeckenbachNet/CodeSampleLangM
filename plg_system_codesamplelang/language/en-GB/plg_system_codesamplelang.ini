PLG_SYSTEM_CODESAMPLELANG="System - CodeSampleLangM"
PLG_SYSTEM_CODESAMPLELANG_XML_DESCRIPTION="Sets the languages in TinyMCE's code sample dialog. The list is maintained in the plugin settings."

PLG_SYSTEM_CODESAMPLELANG_FIELD_NOTE_HELP_DESC="This list <strong>replaces</strong> the languages in TinyMCE's code sample dropdown: only the languages listed here appear, in this order. To add a language, add a row; to hide one, remove its row.<br><strong>Display name</strong> is the text in the dropdown, <strong>Prism value</strong> the identifier from <a href=\"https://prismjs.com/#supported-languages\" target=\"_blank\" rel=\"noopener\">prismjs.com</a>, e.g. sql, bash, kotlin, go, rust, powershell, docker."

PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_LABEL="Languages"
PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_DESC="Languages in the code sample dropdown, in this order."

PLG_SYSTEM_CODESAMPLELANG_FIELD_TEXT_LABEL="Display name"
PLG_SYSTEM_CODESAMPLELANG_FIELD_TEXT_HINT="e.g. Kotlin"

PLG_SYSTEM_CODESAMPLELANG_FIELD_VALUE_LABEL="Prism value"
PLG_SYSTEM_CODESAMPLELANG_FIELD_VALUE_HINT="e.g. kotlin"
