PLG_SYSTEM_CODESAMPLELANG="System - Code Sample Languages"
PLG_SYSTEM_CODESAMPLELANG_XML_DESCRIPTION="Adds additional languages to the TinyMCE code sample dialog. The list of languages is maintained comfortably in the plugin settings."

PLG_SYSTEM_CODESAMPLELANG_FIELD_NOTE_HELP_LABEL="Note"
PLG_SYSTEM_CODESAMPLELANG_FIELD_NOTE_HELP_DESC="Enter every language that should additionally appear in the TinyMCE code sample dropdown. 'Display name' is the text shown in the dropdown, 'Prism value' is the technical identifier from prismjs.com/#supported-languages (e.g. sql, bash, kotlin, go, rust, powershell, docker). If the list is empty, a built-in default list is used."

PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_LABEL="Languages"
PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_DESC="Language list for the TinyMCE code sample dialog"

PLG_SYSTEM_CODESAMPLELANG_FIELD_TEXT_LABEL="Display name"
PLG_SYSTEM_CODESAMPLELANG_FIELD_TEXT_DESC="Text shown in the dropdown, e.g. 'Kotlin'"

PLG_SYSTEM_CODESAMPLELANG_FIELD_VALUE_LABEL="Prism value"
PLG_SYSTEM_CODESAMPLELANG_FIELD_VALUE_DESC="Technical identifier, e.g. 'kotlin'"
