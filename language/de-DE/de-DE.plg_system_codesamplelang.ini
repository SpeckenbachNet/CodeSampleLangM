PLG_SYSTEM_CODESAMPLELANG="System - Code-Beispiel-Sprachen"
PLG_SYSTEM_CODESAMPLELANG_XML_DESCRIPTION="Erweitert die Sprachliste im TinyMCE Code-Beispiel-Dialog um zusätzliche Sprachen. Die Sprachliste wird bequem über die Plugin-Einstellungen gepflegt."

PLG_SYSTEM_CODESAMPLELANG_FIELD_NOTE_HELP_LABEL="Hinweis"
PLG_SYSTEM_CODESAMPLELANG_FIELD_NOTE_HELP_DESC="Trage hier alle Sprachen ein, die zusätzlich im TinyMCE Code-Beispiel-Dropdown erscheinen sollen. 'Anzeigename' ist der Text im Dropdown, 'Prism-Wert' die technische Kennung von prismjs.com/#supported-languages (z. B. sql, bash, kotlin, go, rust, powershell, docker). Ist die Liste leer, wird eine eingebaute Standardliste verwendet."

PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_LABEL="Sprachen"
PLG_SYSTEM_CODESAMPLELANG_FIELD_LANGUAGES_DESC="Sprachliste für den TinyMCE Code-Beispiel-Dialog"

PLG_SYSTEM_CODESAMPLELANG_FIELD_TEXT_LABEL="Anzeigename"
PLG_SYSTEM_CODESAMPLELANG_FIELD_TEXT_DESC="Text im Dropdown, z. B. 'Kotlin'"

PLG_SYSTEM_CODESAMPLELANG_FIELD_VALUE_LABEL="Prism-Wert"
PLG_SYSTEM_CODESAMPLELANG_FIELD_VALUE_DESC="Technische Kennung, z. B. 'kotlin'"
